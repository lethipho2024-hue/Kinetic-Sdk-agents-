name: Test

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check kinetic_sdk tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,llm,tokens]"

      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,llm,tokens]"

      - name: Run tests
        run: pytest -q

  # Integration tests against a REAL LLM provider (tests/integration/).
  # Deliberately NON-BLOCKING: these can fail for reasons outside our control
  # (rate limits, provider outages, expired keys), so `continue-on-error`
  # keeps a red integration run from blocking a PR whose unit tests pass.
  # Requires the OPENHANDS_API_KEY repository secret; without it the tests
  # self-skip and the job goes green.
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,llm]"

      - name: Run integration tests (real LLM, non-blocking)
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: pytest -m integration -q

  # Benchmark smoke gate (month-1 roadmap: measurement first).
  # Runs the deterministic mock oracle pipeline: if any solution.patch rots
  # or the harness breaks, the PR fails fast. Mock mode needs no secrets and
  # must ALWAYS stay green (unlike the non-blocking real-LLM integration).
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mock baseline (oracle pipeline smoke)
        env:
          MODEL: mock
          PROFILE: mock
          RUNS: 1
          OUTPUT_DIR: baseline-smoke
        run: bash scripts/run_baseline.sh

      - name: Compact and gate on 100% mock pass rate
        run: |
          python scripts/make_baseline.py baseline-smoke/results.json --output baseline-smoke/baseline.json
          python -c "import json,sys; d=json.load(open('baseline-smoke/baseline.json')); sys.exit(0 if d['success_rate'] == 1.0 else 1)"

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseline-smoke
          path: baseline-smoke/
